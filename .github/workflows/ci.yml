name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: 16 0 * * SAT

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: tree:0

      - name: Compute the image namespace and registry
        id: namespace
        run: >-
          echo "image=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          && echo "registry=ghcr.io/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ steps.namespace.outputs.image }}
          labels: |
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build container image
        id: build
        uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b  # v3.0.2
        with:
          platforms: linux/amd64
          containerfiles: Containerfile
          oci: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Test can run non-kvm images
        run: make test-no-kvm IMAGE=${{ steps.meta.outputs.tags }}

      - name: Add the runner user to the kvm group
        run: sudo adduser "${USER}" kvm

      - name: Test can run kvm based images
        run: sg kvm 'sg "${USER}" "make test-kvm IMAGE=${{ steps.meta.outputs.tags }}"'

      - name: Log in to ghcr
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252  # v2.0
        with:
          username: ${{ github.actor }}
          password: ${{ github.token }}
          registry: ${{ steps.namespace.outputs.registry }}
        if: ${{ github.ref == 'refs/heads/main' }}

      - name: Push images
        id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37  # v3.0.0
        with:
          tags: ${{ steps.build.outputs.tags }}
        if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ${{ steps.namespace.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
        if: ${{ github.ref == 'refs/heads/main' }}
